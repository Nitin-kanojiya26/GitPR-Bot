services:
  # Web Service running Probot + Express Multi-Tenant UI
  - type: web
    name: gitpr-bot
    env: node
    plan: starter
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_URL
        sync: false
      - key: APP_ID
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gitpr-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gitpr-redis
          property: connectionString

  # Managed Redis for BullMQ Queues and Delivery Deduplication
  - type: redis
    name: gitpr-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Managed PostgreSQL 16 (includes native pgvector extension)
  - name: gitpr-postgres
    databaseName: reviewbot
    user: reviewbot
    plan: starter
    postgresMajorVersion: 16
